name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint · types · tests · build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: moneymind
          POSTGRES_PASSWORD: moneymind_dev_only
          POSTGRES_DB: moneymind_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U moneymind -d moneymind_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://moneymind:moneymind_dev_only@localhost:5432/moneymind_test?schema=public
      JWT_ACCESS_SECRET: ci-access-secret-that-is-at-least-32-characters
      JWT_REFRESH_SECRET: ci-refresh-secret-that-is-at-least-32-characters
      COOKIE_SECURE: "false"
      AUTH_RATE_LIMIT_MAX: "1000"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate --schema apps/api/prisma/schema.prisma

      - name: Prepare test database
        run: npx prisma migrate deploy --schema apps/api/prisma/schema.prisma

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  docker:
    name: Docker · ${{ matrix.target }}
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: api
            dockerfile: apps/api/Dockerfile
          - target: web
            dockerfile: apps/web/Dockerfile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          load: true
          tags: moneymind-${{ matrix.target }}:ci
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
